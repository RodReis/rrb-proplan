services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proplan
      POSTGRES_PASSWORD: proplan
      POSTGRES_DB: proplan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria a role proplan_app (não-owner) na 1ª subida do volume. Só roda com
      # pgdata vazio — volume já existente exige rodar o SQL à mão (ver README).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proplan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Runtime da API conecta como role NÃO-owner → sujeita a RLS (Fatia 8).
      DATABASE_URL: postgresql://proplan_app:proplan_app@postgres:5432/proplan
      # Migrations/seed precisam de DDL → owner. Usado por `prisma migrate`.
      DIRECT_URL: postgresql://proplan:proplan@postgres:5432/proplan
      REDIS_URL: redis://redis:6379
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      FRONTEND_URL: http://localhost:5180
      API_PORT: "3311"
      API_URL: http://localhost:3311
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
    ports:
      - "3311:3311"

  web:
    build: ./apps/web
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3311
    ports:
      - "5180:5180"

volumes:
  pgdata:
