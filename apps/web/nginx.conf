# nginx do serviço web (SPEC-027).
#
# `$PORT` é substituído no entrypoint (envsubst) — o Railway escolhe a porta.
server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # Fallback SPA: o React Router resolve a rota no cliente, então qualquer
  # caminho desconhecido devolve o index.html. Sem isto, F5 em /projects/x dá 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets do Vite têm hash no nome → imutáveis, cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O index nunca entra em cache: é ele que aponta para o bundle novo a cada deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
