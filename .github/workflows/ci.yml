name: CI — testes + relatório de evidência

# ADR-019: evidência de teste gerada por máquina e verificada, nunca narrada.
# Roda em todo PR: executa os runners, gera reports/TESTS.md a partir do --json,
# publica no job summary + comentário fixo do PR, e barra o merge se o relatório
# commitado divergir de uma execução limpa (guarda anti-drift).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proplan
          POSTGRES_PASSWORD: proplan
          POSTGRES_DB: proplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://proplan:proplan@localhost:5432/proplan_test
      # A suíte `banco` (int-specs da Fatia 8) resolve a URL por TEST_*, com
      # fallback para a 5433 do dev local — no CI o Postgres é serviço e
      # responde na 5432. Sem estas duas, o harness tentava a 5433, o
      # `migrate deploy` falhava com P1001 e TODA a suíte caía.
      TEST_DIRECT_URL: postgresql://proplan:proplan@localhost:5432/proplan_test
      TEST_DATABASE_URL: postgresql://proplan_app:proplan_app@localhost:5432/proplan_test
      REPORT_PR: "#${{ github.event.pull_request.number }}"
      # O GitHub já tem a URL pronta — o gerador não precisa saber montar link
      # de GitHub (segue repo-agnóstico, TESTING.md §7).
      REPORT_PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4

      # No dev esta role nasce do docker-entrypoint-initdb.d
      # (docker/postgres-init/01-app-role.sql); o serviço do CI não roda aquele
      # init, então ela é criada aqui. Sem ela os int-specs não conectam.
      # NÃO-superuser de propósito: o Postgres PULA row-level security para
      # superuser e para o owner da tabela — com a role errada o RLS vira no-op
      # silencioso e os testes de isolamento passariam sem provar nada
      # (SPEC-022, F1). Os GRANTs de tabela ficam com o harness, que os aplica
      # depois das migrations.
      - name: Cria a role de aplicação (não-owner, sujeita a RLS)
        env:
          PGPASSWORD: proplan
        run: |
          psql -h localhost -p 5432 -U proplan -d proplan_test -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'proplan_app') THEN
                 CREATE ROLE proplan_app WITH LOGIN PASSWORD 'proplan_app'
                   NOSUPERUSER NOCREATEDB NOCREATEROLE;
               END IF;
             END \$\$;"
          psql -h localhost -p 5432 -U proplan -d proplan_test -v ON_ERROR_STOP=1 -c \
            "GRANT USAGE ON SCHEMA public TO proplan_app;"

      # A ISSUE da fatia sai do `refs #N` do corpo do PR — NÃO é o número do PR
      # (ADR-011: `closes #N` é proibido, então `refs #N` é o elo canônico
      # PR→issue). Sem `refs #N` no corpo → '—', e o gerador segue verdadeiro
      # nos números. A SPEC sai do link para docs/specs/SPEC-0XX-*.md, quando há.
      - name: Metadados da entrega (issue, spec, data)
        env:
          # Via env, nunca interpolado no script: o corpo do PR é texto de
          # usuário e ${{ }} direto no `run` seria injeção de shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          issue=$(printf '%s' "$PR_BODY" | grep -oiE 'refs #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          spec=$(printf '%s' "$PR_BODY" | grep -oiE 'SPEC-[0-9]{3}' | head -1 || true)
          echo "REPORT_ISSUE=${issue:+#$issue}" >> "$GITHUB_ENV"
          echo "REPORT_SPEC=${spec:-}" >> "$GITHUB_ENV"
          echo "REPORT_DATE=$(date -u -d "$PR_UPDATED_AT" +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma client
        run: pnpm --filter @proplan/api prisma:generate

      - name: Instalar navegador do Playwright
        run: pnpm --filter @proplan/web exec playwright install --with-deps chromium

      # O append-only é verificado contra a BASE do PR, não contra HEAD: aqui
      # HEAD é o merge commit, cujo TESTS.md é a versão do próprio PR — a guarda
      # estaria conferindo o arquivo contra si mesmo. Fetch raso só dessa ref.
      - name: Buscar a base do PR (baseline do append-only)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.base_ref }}"

      # Self-check do gerador: prova que a própria guarda funciona (append-only,
      # CRLF, histórico zerado). Sem isto, um bug no gerador desliga a guarda em
      # silêncio — foi assim que o registro da SPEC-016 sumiu sob CI verde.
      - name: Self-check do gerador de relatório
        run: pnpm test:report:selfcheck

      # Guarda anti-drift: roda os runners e compara os números frescos com o
      # reports/TESTS.md COMMITADO no PR. Se o dev editou um número à mão (ou
      # esqueceu de rodar `pnpm test:report` e commitar), diverge → falha aqui.
      # NÃO reescreve o arquivo — senão nunca pegaria a forja do commit.
      # O carimbo (linha no histórico) só é exigido de PR que MEXE em teste —
      # PR só de docs não deve ser barrado. Compara contra a base do PR, já
      # buscada acima. `--diff-filter=d` ignora arquivo removido: apagar um
      # spec não cria entrega a carimbar.
      - name: O PR altera testes?
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=d \
            "origin/${{ github.base_ref }}...HEAD" \
            -- '*.spec.ts' '*.int-spec.ts' '*.test.ts' '*.test.tsx' 'apps/web/e2e/**' || true)
          if [ -n "$changed" ]; then
            echo "REQUIRE_ENTRY=1" >> "$GITHUB_ENV"
            echo "PR altera testes — o carimbo no histórico será exigido:"
            printf '%s\n' "$changed"
          else
            echo "PR não altera teste — carimbo dispensado."
          fi

      - name: Rodar testes + guarda anti-drift
        env:
          REPORT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm test:report:check

      # Terceira guarda (issue #110): números certos + histórico íntegro ainda
      # deixavam passar uma entrega SEM linha no histórico — foi assim que
      # SPEC-027 e SPEC-022 mergearam com a tabela sugerindo que não tiveram
      # teste. Roda depois do --check para que a falha de números apareça antes.
      - name: Guarda — a entrega está carimbada no histórico?
        if: env.REQUIRE_ENTRY == '1'
        run: pnpm test:report:check --require-entry

      - name: Publicar tabela no job summary
        if: always()
        run: |
          {
            echo "## Relatório de testes (ADR-019)"
            echo ""
            sed -n '/## Estado atual/,/## Histórico/p' reports/TESTS.md | sed '/## Histórico/d'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentário fixo no PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(sed -n '/## Estado atual/,/## Histórico/p' reports/TESTS.md | sed '/## Histórico/d')
          MARKER="<!-- test-report-sticky -->"
          COMMENT="$MARKER"$'\n'"$BODY"
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq \
            ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$COMMENT"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$COMMENT"
          fi
